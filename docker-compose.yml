version: "3.7"

services:
  manual-peptideos:
    image: manual-peptideos:latest
    build: .
    networks:
      - GustavoSaNet
    deploy:
      mode: replicated
      replicas: 1
      placement:
        constraints:
          - node.role == manager
      labels:
        - traefik.enable=true
        - traefik.http.routers.manual-peptideos.rule=Host(`dr.gustavosa.com.br`) && PathPrefix(`/manual-peptideos`)
        - traefik.http.routers.manual-peptideos.entrypoints=websecure
        - traefik.http.routers.manual-peptideos.tls.certresolver=letsencryptresolver
        - traefik.http.routers.manual-peptideos.service=manual-peptideos
        - traefik.http.routers.manual-peptideos.middlewares=manual-peptideos-stripprefix
        - traefik.http.middlewares.manual-peptideos-stripprefix.stripprefix.prefixes=/manual-peptideos
        - traefik.http.services.manual-peptideos.loadbalancer.server.port=80
        - traefik.http.services.manual-peptideos.loadbalancer.passHostHeader=true

networks:
  GustavoSaNet:
    external: true
